<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
            margin: 50px;
        }
        .stopwatch {
            font-size: 2em;
            margin-bottom: 20px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 1em;
        }
        .laps {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Stopwatch</h1>
    <div class="stopwatch">00:00:00</div>
    <button onclick="startStopwatch()">Start</button>
    <button onclick="pauseStopwatch()">Pause</button>
    <button onclick="resetStopwatch()">Reset</button>
    <button onclick="recordLap()">Lap</button>
    <div class="laps">
        <h3>Lap Times</h3>
        <ul id="lapsList"></ul>
    </div>
    <script>
        let timer;
        let isRunning = false;
        let timeElapsed = 0; 
        let lapCounter = 1;

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000) % 60;
            const minutes = Math.floor(ms / (1000 * 60)) % 60;
            const hours = Math.floor(ms / (1000 * 60 * 60));
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateDisplay() {
            document.querySelector('.stopwatch').textContent = formatTime(timeElapsed);
        }

        function startStopwatch() {
            if (!isRunning) {
                isRunning = true;
                const startTime = Date.now() - timeElapsed;
                timer = setInterval(() => {
                    timeElapsed = Date.now() - startTime;
                    updateDisplay();
                }, 100);
            }
        }

        function pauseStopwatch() {
            clearInterval(timer);
            isRunning = false;
        }

        function resetStopwatch() {
            clearInterval(timer);
            isRunning = false;
            timeElapsed = 0;
            updateDisplay();
            document.getElementById('lapsList').innerHTML = '';
            lapCounter = 1;
        }

        function recordLap() {
            if (isRunning) {
                const lapList = document.getElementById('lapsList');
                const lapTime = formatTime(timeElapsed);
                const listItem = document.createElement('li');
                listItem.textContent = `Lap ${lapCounter++}: ${lapTime}`;
                lapList.appendChild(listItem);
            }
        }
    </script>
</body>
</html>
